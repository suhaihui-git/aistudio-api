services:
  aistudio-api:
    image: ghcr.io/chrysoljq/aistudio-api:latest
    container_name: aistudio-api
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - aistudio-api-data:/app/data

  nginx:
    image: nginx:1.27-alpine
    container_name: aistudio-api-nginx
    restart: unless-stopped
    depends_on:
      - aistudio-api
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  aistudio-api-data:
