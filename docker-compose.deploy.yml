services:
  aistudio-api:
    image: ghcr.io/chrysoljq/aistudio-api:latest
    container_name: aistudio-api
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "${AISTUDIO_LOGIN_NOVNC_BIND:-127.0.0.1:6080}:6080"
    volumes:
      - aistudio-api-data:/app/data
    environment:
      - AISTUDIO_ENABLE_LOGIN_DESKTOP=1
      - AISTUDIO_LOGIN_NOVNC_PORT=6080
      - AISTUDIO_LOGIN_NOVNC_BIND=${AISTUDIO_LOGIN_NOVNC_BIND:-127.0.0.1:6080}
      - AISTUDIO_LOGIN_NOVNC_URL=${AISTUDIO_LOGIN_NOVNC_URL:-}
      - AISTUDIO_LOGIN_NOVNC_PUBLIC_PORT=${AISTUDIO_LOGIN_NOVNC_PUBLIC_PORT:-6080}
      - AISTUDIO_LOGIN_NOVNC_SCHEME=${AISTUDIO_LOGIN_NOVNC_SCHEME:-}
      - AISTUDIO_LOGIN_DESKTOP_GEOMETRY=${AISTUDIO_LOGIN_DESKTOP_GEOMETRY:-1600x900x24}
      - AISTUDIO_LOGIN_BROWSER_WIDTH=${AISTUDIO_LOGIN_BROWSER_WIDTH:-1440}
      - AISTUDIO_LOGIN_BROWSER_HEIGHT=${AISTUDIO_LOGIN_BROWSER_HEIGHT:-800}
      - AISTUDIO_LOGIN_VNC_PASSWORD=${AISTUDIO_LOGIN_VNC_PASSWORD:-}
      - AISTUDIO_CAMOUFOX_HEADLESS=${AISTUDIO_CAMOUFOX_HEADLESS:-0}
      - AISTUDIO_ACCOUNTS_DIR=/app/data/accounts
      - AISTUDIO_API_KEYS_FILE=/app/data/api_keys.json
      - AISTUDIO_ADMIN_PASSWORD=${AISTUDIO_ADMIN_PASSWORD:?set AISTUDIO_ADMIN_PASSWORD in .env}
      - AISTUDIO_ADMIN_SESSION_SECRET=${AISTUDIO_ADMIN_SESSION_SECRET:?set AISTUDIO_ADMIN_SESSION_SECRET in .env}
      - AISTUDIO_SINGLE_ACCOUNT_MAX_CONCURRENCY=${AISTUDIO_SINGLE_ACCOUNT_MAX_CONCURRENCY:-1}
      - AISTUDIO_BROWSER_WARMUP_WORKERS=${AISTUDIO_BROWSER_WARMUP_WORKERS:-1}
      - AISTUDIO_BROWSER_IDLE_TIMEOUT_SECONDS=${AISTUDIO_BROWSER_IDLE_TIMEOUT_SECONDS:-900}
      - AISTUDIO_ACCOUNT_OPERATION_TIMEOUT=${AISTUDIO_ACCOUNT_OPERATION_TIMEOUT:-30}

volumes:
  aistudio-api-data:
