<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Studio Proxy</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body x-data="app()" x-init="init()" @click="configOpen=false">
  <div class="login-page" x-show="authChecked && !authed" x-cloak>
    <div class="login-panel">
      <div class="logo">AI</div>
      <h1>管理员登录</h1>
      <div class="modal-field">
        <label>管理员密码</label>
        <input class="modal-input" type="password" x-model="login.password" @keydown.enter="loginAdmin()"
          placeholder="AISTUDIO_ADMIN_PASSWORD">
      </div>
      <div class="login-error" x-show="login.error" x-text="login.error"></div>
      <button class="btn btn-primary btn-block" :disabled="login.busy" @click="loginAdmin()">
        <span x-show="!login.busy">登录</span>
        <span x-show="login.busy">登录中...</span>
      </button>
    </div>
  </div>
  <template x-if="authed">
  <div class="app-shell">
  <div class="overlay" :class="{open:sidebarOpen}" @click="sidebarOpen=false"></div>
  <nav class="sidebar" :class="{open:sidebarOpen}">
    <div class="sidebar-header">
      <div style="display:flex;gap:6px;margin-right:auto">
        <div style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></div>
        <div style="width:12px;height:12px;border-radius:50%;background:#ffbd2e"></div>
        <div style="width:12px;height:12px;border-radius:50%;background:#28c840"></div>
      </div>
      <div class="logo">AI</div><span>AI Studio Proxy</span>
    </div>
    <div class="nav-section">
      <button class="nav-item" :class="{active:view==='chat'}" @click="go('chat')">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
        </svg> Playground </button>
      <button class="nav-item" :class="{active:view==='dashboard'}" @click="go('dashboard')">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <line x1="3" y1="9" x2="21" y2="9" />
          <line x1="9" y1="21" x2="9" y2="9" />
        </svg> 控制面板 </button>
      <button class="nav-item" :class="{active:view==='accounts'}" @click="go('accounts')">
        <svg viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 00-3-3.87" />
          <path d="M16 3.13a4 4 0 010 7.75" />
        </svg> 账号管理 </button>
      <button class="nav-item" :class="{active:view==='settings'}" @click="go('settings')">
        <svg viewBox="0 0 24 24">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4Z" />
        </svg> 设置 </button>
    </div>
    <div class="sidebar-footer">
      <div class="dot"></div><span>系统在线</span>
      <button class="btn btn-sm" style="margin-left:auto" @click="logoutAdmin()">退出</button>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mh-btn" @click="sidebarOpen=true">☰</button>
        <template x-if="view==='chat'">
          <div class="cselect cselect-lg" :class="{open:openSelect==='model'}" @click.stop>
            <div class="cselect-btn" @click="toggleSelect('model',$event)" tabindex="0">
              <span x-text="model||'选择模型'"></span><span class="arrow"></span>
            </div>
            <div class="cselect-menu">
              <template x-for="m in models" :key="m.id">
                <div class="cselect-opt" :class="{active:model===m.id}" @click="model=m.id;openSelect=null"
                  x-text="m.id"></div>
              </template>
            </div>
          </div>
        </template>
        <template x-if="view!=='chat'">
          <span class="topbar-title"
            x-text="view==='dashboard'?'控制面板':view==='accounts'?'账号管理':'设置'"></span>
        </template>
      </div>
      <div class="topbar-right" @click.stop>
        <template x-if="view==='chat' && msgs.length > 0">
          <button class="icon-btn" @click="clearMessages()" title="清空消息">
            <svg viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
            </svg>
          </button>
        </template>
        <button class="icon-btn" :class="{active:configOpen}" @click="configOpen=!configOpen" title="Chat Settings">
          <svg viewBox="0 0 24 24">
            <path
              d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <div class="cfg-dropdown" x-show="configOpen" x-cloak @click.stop>
          <div class="cfg-head">聊天设置</div>
          <div class="cfg-body">
            <div class="cfg-item">
              <div class="cfg-info">
                <div class="cfg-name">推理强度 (Thinking)</div>
                <div class="cfg-desc">启用模型思维链推理</div>
              </div>
              <div class="cfg-ctrl">
                <div class="cselect" :class="{open:openSelect==='thinking'}" @click.stop>
                  <div class="cselect-btn" @click="toggleSelect('thinking',$event)" tabindex="0"><span
                      x-text="cfg.thinking==='off'?'关闭':cfg.thinking==='low'?'低':cfg.thinking==='medium'?'中':cfg.thinking==='high'?'高':cfg.thinking"></span><span
                      class="arrow"></span></div>
                  <div class="cselect-menu"><template x-for="v in ['off','low','medium','high']">
                      <div class="cselect-opt" :class="{active:cfg.thinking===v}"
                        @click="cfg.thinking=v;openSelect=null"
                        x-text="v==='off'?'关闭':v==='low'?'低':v==='medium'?'中':v==='high'?'高':v"></div>
                    </template></div>
                </div>
              </div>
            </div>
            <div class="cfg-item">
              <div class="cfg-info">
                <div class="cfg-name">谷歌搜索 (Search)</div>
                <div class="cfg-desc">启用联网搜索功能</div>
              </div>
              <div class="cfg-ctrl">
                <div class="cselect" :class="{open:openSelect==='search'}" @click.stop>
                  <div class="cselect-btn" @click="toggleSelect('search',$event)" tabindex="0"><span
                      x-text="cfg.search==='on'?'开启':'关闭'"></span><span class="arrow"></span></div>
                  <div class="cselect-menu"><template x-for="v in ['off','on']">
                      <div class="cselect-opt" :class="{active:cfg.search===v}" @click="cfg.search=v;openSelect=null"
                        x-text="v==='on'?'开启':'关闭'"></div>
                    </template></div>
                </div>
              </div>
            </div>
            <div class="cfg-item">
              <div class="cfg-info">
                <div class="cfg-name">流式输出 (Stream)</div>
                <div class="cfg-desc">逐字生成内容</div>
              </div>
              <div class="cfg-ctrl">
                <div class="cselect" :class="{open:openSelect==='stream'}" @click.stop>
                  <div class="cselect-btn" @click="toggleSelect('stream',$event)" tabindex="0"><span
                      x-text="cfg.stream==='on'?'开启':'关闭'"></span><span class="arrow"></span></div>
                  <div class="cselect-menu"><template x-for="v in ['on','off']">
                      <div class="cselect-opt" :class="{active:cfg.stream===v}" @click="cfg.stream=v;openSelect=null"
                        x-text="v==='on'?'开启':'关闭'"></div>
                    </template></div>
                </div>
              </div>
            </div>
            <div class="cfg-item">
              <div class="cfg-info">
                <div class="cfg-name">温度 (Temperature)</div>
                <div class="cfg-desc">0 = 稳定, 2 = 创意</div>
              </div>
              <div class="cfg-ctrl"><input class="cfg-num" type="number" x-model.number="cfg.temperature" min="0"
                  max="2" step="0.1"></div>
            </div>
            <div class="cfg-item">
              <div class="cfg-info">
                <div class="cfg-name">Top P</div>
                <div class="cfg-desc">核采样阈值</div>
              </div>
              <div class="cfg-ctrl"><input class="cfg-num" type="number" x-model.number="cfg.topP" min="0" max="1"
                  step="0.05"></div>
            </div>
            <div class="cfg-item">
              <div class="cfg-info">
                <div class="cfg-name">最大 Token</div>
                <div class="cfg-desc">最大生成长度</div>
              </div>
              <div class="cfg-ctrl"><input class="cfg-num" type="number" x-model.number="cfg.maxTokens" min="1"
                  max="65536" step="256"></div>
            </div>
            <div class="cfg-item">
              <div class="cfg-info">
                <div class="cfg-name">安全过滤 (Safety)</div>
                <div class="cfg-desc">内容合规性检查</div>
              </div>
              <div class="cfg-ctrl">
                <div class="cselect" :class="{open:openSelect==='safety'}" @click.stop>
                  <div class="cselect-btn" @click="toggleSelect('safety',$event)" tabindex="0"><span
                      x-text="cfg.safety==='on'?'开启':'关闭'"></span><span class="arrow"></span></div>
                  <div class="cselect-menu"><template x-for="v in ['on','off']">
                      <div class="cselect-opt" :class="{active:cfg.safety===v}" @click="cfg.safety=v;openSelect=null"
                        x-text="v==='on'?'开启':'关闭'"></div>
                    </template></div>
                </div>
              </div>
            </div>
            <div class="cfg-sep"></div>
            <div class="cfg-item" style="padding-top:4px">
              <button class="btn btn-danger btn-block" @click="clearCache()">清理本地缓存</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Chat -->
    <div id="chat-page" :class="{active:view==='chat'}">
      <div id="chat-scroll">
        <template x-if="msgs.length===0">
          <div class="welcome">
            <div class="welcome-icon">
              <svg viewBox="0 0 24 24" style="width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:1.5">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
              </svg>
            </div>
            <h2>今天我能帮您做什么？</h2>
            <p>选择模型后发送消息来测试 AI Studio 代理服务</p>
            <div class="welcome-suggestions">
              <button class="suggestion-chip" @click="draft='解释一下量子计算的基本原理';$refs.ta.focus()">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2">
                  <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                解释量子计算
              </button>
              <button class="suggestion-chip" @click="draft='帮我写一个 Python 快速排序算法';$refs.ta.focus()">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2">
                  <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
                </svg>
                编写代码
              </button>
              <button class="suggestion-chip" @click="draft='总结一下人工智能的发展历史';$refs.ta.focus()">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2">
                  <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
                </svg>
                总结内容
              </button>
            </div>
          </div>
        </template>
        <template x-for="(m,i) in msgs" :key="i">
          <div class="msg" :class="m.role==='user'?'':'msg-ai'">
            <div class="msg-inner">
              <div class="avatar" :class="m.role==='user'?'avatar-user':'avatar-ai'" x-text="m.role==='user'?'U':'AI'">
              </div>
              <div style="flex:1;min-width:0">
                <template x-if="m.role==='user'">
                  <div style="display:flex;justify-content:flex-end;margin-bottom:4px;gap:4px">
                    <button class="icon-btn" style="width:28px;height:28px;padding:4px" @click="resendMessage(i)" :disabled="busy" title="重新发送">
                      <svg viewBox="0 0 24 24" style="width:16px;height:16px">
                        <polyline points="1 4 1 10 7 10" />
                        <polyline points="23 20 23 14 17 14" />
                        <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15" />
                      </svg>
                    </button>
                    <button class="icon-btn" style="width:28px;height:28px;padding:4px" @click="deleteMessage(i)" title="删除消息">
                      <svg viewBox="0 0 24 24" style="width:16px;height:16px">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
                      </svg>
                    </button>
                  </div>
                </template>
                <template x-if="m.role!=='user'">
                  <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
                    <button class="icon-btn" style="width:28px;height:28px;padding:4px" @click="deleteMessage(i)" title="删除消息">
                      <svg viewBox="0 0 24 24" style="width:16px;height:16px">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
                      </svg>
                    </button>
                  </div>
                </template>
                <template x-if="m.thinking">
                  <div class="think-block" @click="m.showThinking=!m.showThinking">
                    <div class="think-toggle"><span>思考中</span><span class="think-arrow"
                        :class="{open:m.showThinking}">›</span></div>
                    <div class="think-body" x-show="m.showThinking" x-text="m.thinking"></div>
                  </div>
                </template>
                <div class="msg-body markdown-body" :class="{error:m.error}"
                  x-html="renderMarkdown(m.error||m.content)"></div>
                <template x-if="m.images && m.images.length">
                  <div class="msg-images">
                    <template x-for="img in m.images">
                      <div class="msg-img-item" @click="window.open(img)">
                        <img :src="img">
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
      <div id="input-area">
        <div class="input-wrap">
          <template x-if="selectedImages.length > 0">
            <div class="preview-container">
              <template x-for="(img, idx) in selectedImages" :key="idx">
                <div class="preview-item">
                  <img :src="img">
                  <button class="preview-remove" @click="removeImage(idx)">×</button>
                </div>
              </template>
            </div>
          </template>
          <div id="input-box">
            <input type="file" x-ref="fileInput" @change="handleImageUpload" accept="image/*" multiple
              style="display:none">
            <button class="upload-btn" @click="$refs.fileInput.click()" title="上传图片">
              <svg viewBox="0 0 24 24">
                <path
                  d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
              </svg>
            </button>
            <textarea x-ref="ta" x-model="draft" @keydown.enter.prevent="if(!$event.shiftKey)send()" @input="resizeTa()"
              placeholder="给 AI Studio 代理发送消息..." rows="1"></textarea>
            <button class="send" :disabled="busy||(!draft.trim() && selectedImages.length === 0)||!model"
              @click="send()">
              <svg viewBox="0 0 24 24">
                <line x1="12" y1="19" x2="12" y2="5" />
                <polyline points="5 12 12 5 19 12" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Dashboard -->
    <div class="page-wrap" :class="{active:view==='dashboard'}">
      <div class="scroll-area">
        <div class="page-pad">
          <div class="dashboard-hero">
            <div class="hero-title">
              <h1>控制面板</h1>
              <p>实时监控您的 AI Studio 代理服务状态</p>
            </div>
          </div>
          <div class="bento-grid">
            <div class="bento-card bento-large">
              <div class="bento-icon" style="background:linear-gradient(135deg,#667eea,#764ba2)">
                <svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2">
                  <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
              <div class="bento-label">当前激活账号</div>
              <div class="bento-value" x-text="activeAccount.email||'暂无激活账号'"></div>
              <div class="bento-meta" x-text="activeAccount.id?'ID: '+activeAccount.id:''"></div>
            </div>
            <div class="bento-card">
              <div class="bento-icon" style="background:linear-gradient(135deg,#f093fb,#f5576c)">
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
              <div class="bento-label">轮询模式</div>
              <div class="bento-value" x-text="rotationMode==='round_robin'?'顺序轮询':rotationMode==='lru'?'LRU':rotationMode==='least_rl'?'最小限制':rotationMode"></div>
            </div>
            <div class="bento-card">
              <div class="bento-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2">
                  <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
                </svg>
              </div>
              <div class="bento-label">总请求数</div>
              <div class="bento-value" x-text="totalReqs"></div>
            </div>
            <div class="bento-card">
              <div class="bento-icon" style="background:linear-gradient(135deg,#fa709a,#fee140)">
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2">
                  <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              </div>
              <div class="bento-label">429 限制</div>
              <div class="bento-value" x-text="totalRL"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head">
              <span>模型统计</span>
              <span style="font-size:13px;color:var(--muted);font-weight:400" x-text="Object.keys(stats).length+' 个模型'"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>模型</th>
                    <th>请求</th>
                    <th>成功</th>
                    <th>429</th>
                    <th>错误</th>
                    <th>最后使用</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(s,n) in stats" :key="n">
                    <tr>
                      <td><div style="font-weight:600;font-size:13px" x-text="n.replace('models/','')"></div></td>
                      <td><span style="font-weight:500" x-text="s.requests||0"></span></td>
                      <td><span class="badge badge-green" x-text="s.success||0"></span></td>
                      <td><span class="badge" :class="(s.rate_limited||0)>0?'badge-red':'badge-gray'" x-text="s.rate_limited||0"></span></td>
                      <td><span style="color:var(--muted)" x-text="s.errors||0"></span></td>
                      <td style="font-size:12px;color:var(--muted)" x-text="fmtDate(s.last_used)"></td>
                    </tr>
                  </template>
                  <tr x-show="!Object.keys(stats).length">
                    <td colspan="6" style="text-align:center;color:var(--muted);padding:32px">
                      <div style="font-size:15px;margin-bottom:4px">暂无数据</div>
                      <div style="font-size:13px">开始使用后将显示模型统计信息</div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Accounts -->
    <div class="page-wrap" :class="{active:view==='accounts'}">
      <div class="scroll-area">
        <div class="page-pad">
          <div class="page-header">
            <div class="page-header-content">
              <h1>账号管理</h1>
              <p>管理您的 Google 账号池和轮询策略</p>
            </div>
            <div class="page-header-actions">
              <button class="btn" @click="cookieModal.open=true">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                导入 Cookies
              </button>
              <input type="file" x-ref="accountImport" accept="application/json,.json" style="display:none" @change="importAccountFile">
              <button class="btn" @click="$refs.accountImport.click()">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                导入账号
              </button>
              <button class="btn btn-primary" @click="addAccount()">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                登录账号
              </button>
            </div>
          </div>
          <div class="feature-card" x-show="loginAssist.active" x-cloak>
            <div class="feature-card-icon" style="background:linear-gradient(135deg,#667eea,#764ba2)">
              <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2">
                <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
            </div>
            <div class="feature-card-content">
              <h3>远程登录输入</h3>
              <p>通过 noVNC 远程控制浏览器进行账号登录</p>
              <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:16px">
                <div class="modal-field" style="min-width:280px;flex:1">
                  <label>输入内容</label>
                  <input class="modal-input" type="password" x-model="loginAssist.text" @keydown.enter.prevent="pasteLoginText()" placeholder="先点击远程浏览器输入框，再在这里粘贴">
                </div>
                <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding-bottom:11px">
                  <input type="checkbox" x-model="loginAssist.pressEnter"> 输入后回车
                </label>
                <button class="btn btn-primary" :disabled="loginAssist.busy||!loginAssist.text" @click="pasteLoginText()">
                  <span x-show="!loginAssist.busy">输入到远程浏览器</span>
                  <span x-show="loginAssist.busy">输入中...</span>
                </button>
                <button class="btn" x-show="loginAssist.browserUrl" @click="window.open(loginAssist.browserUrl,'_blank','noopener,noreferrer')">重新打开 noVNC</button>
              </div>
            </div>
          </div>
          <div class="settings-grid">
            <div class="settings-card">
              <div class="settings-card-header">
                <div class="settings-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">
                  <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                </div>
                <h3>轮询设置</h3>
              </div>
              <div class="settings-card-body">
                <div class="setting-item">
                  <label>轮询模式</label>
                  <div class="cselect" :class="{open:openSelect==='rotMode'}" @click.stop>
                    <div class="cselect-btn" @click="toggleSelect('rotMode',$event)" tabindex="0" style="min-width:180px">
                      <span x-text="rotCfg.mode==='round_robin'?'顺序轮询':rotCfg.mode==='lru'?'最近最少使用 (LRU)':rotCfg.mode==='least_rl'?'最小频率限制':'未知'"></span>
                      <span class="arrow"></span>
                    </div>
                    <div class="cselect-menu">
                      <template x-for="v in ['round_robin','lru','least_rl']">
                        <div class="cselect-opt" :class="{active:rotCfg.mode===v}" @click="rotCfg.mode=v;openSelect=null" x-text="v==='round_robin'?'顺序轮询':v==='lru'?'最近最少使用 (LRU)':v==='least_rl'?'最小频率限制':v"></div>
                      </template>
                    </div>
                  </div>
                </div>
                <div class="setting-item">
                  <label>冷却时间 (秒)</label>
                  <input type="number" x-model.number="rotCfg.cooldown" class="modal-input" style="width:100px" min="0">
                </div>
              </div>
              <div class="settings-card-footer">
                <button class="btn" @click="forceNext()">强制切换</button>
                <button class="btn btn-primary" @click="saveRotation()">保存设置</button>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><span>账号池</span><span style="font-size:13px;color:var(--muted)"
                x-text="accountRows.length+' 个账号'"></span></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>邮箱</th>
                    <th>请求</th>
                    <th>成功</th>
                    <th>429</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="a in accountRows" :key="a.id">
                    <tr>
                      <td>
                        <div style="font-weight:500" x-text="a.email||a.name||a.id"></div>
                        <div style="font-size:12px;color:var(--muted);font-family:monospace" x-text="a.id"></div>
                      </td>
                      <td x-text="a.requests||0"></td>
                      <td><span class="badge badge-green" x-text="a.success||0"></span></td>
                      <td><span class="badge" :class="(a.rate_limited||0)>0?'badge-red':'badge-gray'"
                          x-text="a.rate_limited||0"></span></td>
                      <td><span class="badge badge-green" x-show="a.id===activeId">激活</span><span
                          class="badge badge-gray" x-show="a.id!==activeId">待命</span></td>
                      <td>
                        <div class="action-row">
                          <button class="btn btn-sm" x-show="a.id!==activeId"
                            @click="activateAccount(a.id)">手动激活</button>
                          <button class="btn btn-sm" @click="editAccount(a)">编辑</button>
                          <button class="btn btn-sm" @click="exportAccount(a.id)">导出</button>
                          <button class="btn btn-sm btn-danger" @click="deleteAccount(a.id)">删除</button>
                        </div>
                      </td>
                    </tr>
                  </template>
                  <tr x-show="!accountRows.length">
                    <td colspan="6" style="text-align:center;color:var(--muted);padding:24px">暂无账号</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Settings -->
    <div class="page-wrap" :class="{active:view==='settings'}">
      <div class="scroll-area">
        <div class="page-pad">
          <div class="page-header">
            <div class="page-header-content">
              <h1>设置</h1>
              <p>管理 API 密钥和系统配置</p>
            </div>
          </div>
          <div class="settings-grid">
            <div class="settings-card">
              <div class="settings-card-header">
                <div class="settings-icon" style="background:linear-gradient(135deg,#f093fb,#f5576c)">
                  <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2">
                    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
                  </svg>
                </div>
                <h3>当前请求 Key</h3>
              </div>
              <div class="settings-card-body">
                <div class="setting-item">
                  <label>API Key</label>
                  <input class="modal-input" type="password" x-model="apiKeyInput" placeholder="sk-aistudio-...">
                </div>
              </div>
              <div class="settings-card-footer">
                <button class="btn" @click="clearApiKey()">清除</button>
                <button class="btn btn-primary" @click="saveApiKey()">保存</button>
              </div>
            </div>
            <div class="settings-card">
              <div class="settings-card-header">
                <div class="settings-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">
                  <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                </div>
                <h3>创建新 Key</h3>
              </div>
              <div class="settings-card-body">
                <div class="setting-item">
                  <label>Key 名称</label>
                  <input class="modal-input" x-model="newKeyName" placeholder="默认 Key">
                </div>
                <div class="key-box" x-show="createdKey" style="margin:0">
                  <div class="key-label">新创建的 Key</div>
                  <code x-text="createdKey"></code>
                </div>
              </div>
              <div class="settings-card-footer">
                <button class="btn btn-primary" @click="createApiKey()">创建 Key</button>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-head">
              <span>API Key 列表</span>
              <span style="font-size:13px;color:var(--muted);font-weight:400" x-text="apiKeys.length+' 个密钥'"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>名称</th>
                    <th>前缀</th>
                    <th>创建时间</th>
                    <th>最后使用</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="k in apiKeys" :key="k.id">
                    <tr>
                      <td><div style="font-weight:600;font-size:13px" x-text="k.name"></div></td>
                      <td><code style="font-size:12px;background:rgba(0,0,0,0.05);padding:4px 8px;border-radius:4px" x-text="k.prefix+'...'"></code></td>
                      <td style="font-size:12px;color:var(--muted)" x-text="fmtDate(k.created_at ? k.created_at * 1000 : null)"></td>
                      <td style="font-size:12px;color:var(--muted)" x-text="fmtDate(k.last_used_at ? k.last_used_at * 1000 : null)"></td>
                      <td><button class="btn btn-sm btn-danger" @click="deleteApiKey(k.id)">删除</button></td>
                    </tr>
                  </template>
                  <tr x-show="!apiKeys.length">
                    <td colspan="5" style="text-align:center;color:var(--muted);padding:32px">
                      <div style="font-size:15px;margin-bottom:4px">暂无 API Key</div>
                      <div style="font-size:13px">创建一个新的 API Key 开始使用</div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Cookie Import Modal -->
  <div class="modal-overlay" x-show="cookieModal.open" x-cloak @click.self="cookieModal.open=false"
    x-transition.opacity>
    <div class="modal" x-show="cookieModal.open" x-transition>
      <div class="modal-head">
        <span>导入 Cookies</span>
        <button class="modal-close" @click="cookieModal.open=false">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Cookie 字符串 <span style="color:var(--muted);font-weight:400">(每行一个或用分号分隔)</span></label>
          <textarea class="modal-textarea" x-model="cookieModal.cookies"
            placeholder="SID=xxx; SSID=xxx; HSID=xxx; ...&#10;或每行一个：&#10;SID=xxx&#10;SSID=xxx&#10;HSID=xxx"
            rows="8"></textarea>
        </div>
        <div style="display:flex;gap:12px">
          <div class="modal-field" style="flex:1">
            <label>账号名称 <span style="color:var(--muted);font-weight:400">(可选)</span></label>
            <input class="modal-input" x-model="cookieModal.name" placeholder="My Account">
          </div>
          <div class="modal-field" style="flex:1">
            <label>邮箱 <span style="color:var(--muted);font-weight:400">(可选)</span></label>
            <input class="modal-input" x-model="cookieModal.email" placeholder="user@gmail.com">
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" @click="cookieModal.open=false">取消</button>
        <button class="btn btn-primary" :disabled="cookieModal.importing" @click="importCookies()">
          <span x-show="!cookieModal.importing">导入</span>
          <span x-show="cookieModal.importing">导入中...</span>
        </button>
      </div>
    </div>
  </div>
  <!-- Account Edit Modal -->
  <div class="modal-overlay" x-show="accountModal.open" x-cloak @click.self="accountModal.open=false"
    x-transition.opacity>
    <div class="modal" x-show="accountModal.open" x-transition>
      <div class="modal-head">
        <span>编辑账号</span>
        <button class="modal-close" @click="accountModal.open=false">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>账号名称</label>
          <input class="modal-input" x-model="accountModal.name" placeholder="账号名称">
        </div>
        <div class="modal-field">
          <label>邮箱</label>
          <input class="modal-input" x-model="accountModal.email" placeholder="user@gmail.com">
        </div>
        <div class="modal-field">
          <label>账号 ID</label>
          <input class="modal-input" x-model="accountModal.id" disabled>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" @click="accountModal.open=false">取消</button>
        <button class="btn btn-primary" :disabled="accountModal.saving" @click="saveAccountMeta()">
          <span x-show="!accountModal.saving">保存</span>
          <span x-show="accountModal.saving">保存中...</span>
        </button>
      </div>
    </div>
  </div>
  <div class="toast" :class="{show:toast.show}" x-text="toast.msg"></div>
  </div>
  </template>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="/static/app.js"></script>
  <script defer src="/static/alpine.min.js"></script>
</body>

</html>
